<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  
  <style>
    body {background-color: #F1EDEB; font-size: 18px; color: #483121}
    h1, h2 {color: #B5532A}
    a:link {color: #B5532A}
    a:visited {color: #B5532A}
    a:hover {color: #B5532A}
    a:focus {color: #B5532A}
    a:active {color: #C19E84}

    .button-link {display: inline-block; padding: 12px 24px; background-color: #F1EDEB; color: white; text-decoration: none; cursor: pointer}
    .button-link:hover {background-color: #C19E84}
    .button-link:focus {outline: 2px solid #C19E84; outline-offset: 2px}
    .button-link:active {background-color: #C19E84}

    img {border-radius: 12px}

    nav li {display: inline-block; margin-right: 20px}

    header {display: flex; align-items: center; background-color: #F1EDEB; border-bottom: 2px solid #B5532A}

    textarea {border-radius: 8px; outline: 1px solid #C19E84}
    input {border-radius: 4px; outline: 1px solid #C19E84}
  </style>

</head>
<body>

  <header>
    <img src="images/bakery-logo.png" alt="North Star Bakery logo" width="100">
    <nav>
      <ul>
        <a href= "index.html" class="button-link">Home</a>
        <a href= "products.html" class="button-link">Products</a>
        <a href= "about.html" class="button-link">About</a>
        <a href= "contact.html"class="button-link">Contact</a>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p>128 Maple Street. Tue-Sun, 7am to 5pm. Closed Monday.</p>

    <form>
      <fieldset>
        <legend>Pre-order or question</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required><br>

        <label for="date">Pickup date:</label>
        <input type="date" id="date" required><br>

        <label for="type">Request type:</label>
        <select id="type">
          <option>Pre-order</option>
          <option>General question</option>
        </select><br>

        <label for="items">Item details:</label>
        <textarea id="items" required></textarea><br>

        <label for="allergy">Allergy notes:</label>
        <textarea id="allergy"></textarea><br>

        <button type="submit">Send</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>North Star Bakery, 128 Maple Street</p>
  </footer>

</body>
</html>
