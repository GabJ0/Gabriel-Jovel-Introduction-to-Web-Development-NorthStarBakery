<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products</title>

  <style>
    body {background-color: #F1EDEB; font-size: 18px; color: #483121; font-family: Georgia, "Times New Roman", serif}
    h1, h2 {color: #B5532A; font-family: "Palatino Linotype", Palatino, Georgia, serif}
    a:link {color: #B5532A}
    a:visited {color: #B5532A}
    a:hover {color: #B5532A}
    a:focus {color: #B5532A}
    a:active {color: #C19E84}

    .button-link {display: inline-block; padding: 12px 24px; background-color: #F1EDEB; color: #483121; text-decoration: none; cursor: pointer}
    .button-link:hover {background-color: #C19E84}
    .button-link:focus {outline: 2px solid #C19E84; outline-offset: 2px}
    .button-link:active {background-color: #C19E84}

    img {border-radius: 12px}
    img, video {max-width: 100%; height: auto}
    nav li {display: inline-block; margin-right: 20px}

    header {display: flex; flex-wrap: wrap; align-items: center; background-color: #F1EDEB; border-bottom: 2px solid #B5532A}

    button {background-color: #B5532A; color: #F1EDEB; border: none; border-radius: 6px; padding: 10px 16px; cursor: pointer}
    button:hover {background-color: #C19E84; color: #483121}
   
    #total, #message {color: #B5532A; font-weight: bold} 

</style>

</head>

<script>
  let cart = {};

  function addItem(name, price) {if (cart[name]) {cart[name].qty = cart[name].qty + 1} else {cart[name] = {price: price, qty: 1}}showCart()}

  function removeItem(name) {cart[name].qty = cart[name].qty - 1; if (cart[name].qty === 0) {delete cart[name]} showCart()}

  function showCart() {let html = ""; let total = 0; for (let name in cart) {html = html + "<li>" + name + " x " + cart[name].qty + " = $" + cart[name].price * cart[name].qty + " <button onclick=\"removeItem('" + name + "')\">-</button></li>"; total = total + cart[name].price * cart[name].qty}
  document.getElementById("list").innerHTML = html; document.getElementById("total").textContent = total}

  function checkout() {let total = 0; for (let name in cart) {total = total + cart[name].price * cart[name].qty} if (total === 0) {document.getElementById("message").textContent = "Your order is empty."; return}
  document.getElementById("message").innerHTML = "Thank you! Your order total was $" + total + ".<br>It will be ready for pickup shortly."; cart = {}; showCart()}
</script>

<body>

  <header>
    <img src="North_Star_Bakery/images/bakery-logo.png" alt="North Star Bakery logo" width="100">
    <nav>
      <ul>
        <a href= "index.html" class="button-link">Home</a>
        <a href= "products.html" class="button-link">Products</a>
        <a href= "about.html" class="button-link">About</a>
        <a href= "contact.html"class="button-link">Contact</a>
      </ul>
    </nav>
  </header>

  <main>
     <h2>My order</h2>
     <button onclick="addItem('Harvest Cookie Box', 18)">Add Harvest Cookie Box ($18)</button>
     <button onclick="addItem('Sourdough loaf', 8)">Add Sourdough loaf ($8)</button>
     <button onclick="addItem('Croissant', 4)">Add Croissant ($4)</button>
     <button onclick="checkout()">Checkout</button><p id="message"></p>

     <ul id="list"></ul>
     <p>Total: $<span id="total">0</span></p>

    <h1>Our Products</h1>

    <figure>
      <img src="North_Star_Bakery/images/bakery-signature-loaf.jpg" alt="Round sourdough loaf on a towel" width="480">
      <figcaption>Signature Loaf</figcaption>
    </figure>

    <h2>Breads</h2>
    <img src="North_Star_Bakery/images/bakery-bread.jpg" alt="Loaves of bread in a display case" width="300">
    <p>Sourdough and rolls. $6 to $11.</p>

    <h2>Pastries</h2>
    <p>Croissants and cookies. $3 to $20.</p>

    <h2>Cakes</h2>
    <p>Loaf cakes and party cakes. $12 to $85.</p>
  </main>

  <footer>
    <p>North Star Bakery, 128 Maple Street</p>
  </footer>

</body>
</html>
